<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Terminal executando pipeline.sh com o nome Alonso Moura Germano, dados, back-end e automação com IA, e a frase café pronto">
  <title>Alonso Moura Germano</title>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace; }
    .t { fill: #DFC9A0; font-size: 17px; }
    .dim { fill: #9C8456; }
    .name { fill: #F4EBDA; font-size: 30px; font-weight: 700; }
    .l1, .l2, .l3, .l4, .l5 { opacity: 0; animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: step-end; }
    .l1 { animation-name: k1; }
    .l2 { animation-name: k2; }
    .l3 { animation-name: k3; }
    .l4 { animation-name: k4; }
    .l5 { animation-name: k5; }
    @keyframes k1 { 0% { opacity: 0 } 3% { opacity: 1 } 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k2 { 0% { opacity: 0 } 15% { opacity: 1 } 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k3 { 0% { opacity: 0 } 28% { opacity: 1 } 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k4 { 0% { opacity: 0 } 42% { opacity: 1 } 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes k5 { 0% { opacity: 0 } 60% { opacity: 1 } 96% { opacity: 1 } 100% { opacity: 0 } }
    .cursor { animation: blink 1s step-end infinite; fill: #DFC9A0; }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    .steam { fill: #B29B71; opacity: 0; animation: rise 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; }
    .s3 { animation-delay: 2s; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(6px) } 40% { opacity: .9 } 100% { opacity: 0; transform: translateY(-10px) } }
    @media (prefers-reduced-motion: reduce) {
      .l1, .l2, .l3, .l4, .l5 { animation: none; opacity: 1; }
      .cursor, .steam { animation: none; }
      .steam { opacity: .8; }
    }
  </style>

  <rect width="900" height="280" fill="#1A1713"/>

  <!-- janela do terminal -->
  <rect x="20" y="20" width="860" height="240" fill="#0B0A09" stroke="#DFC9A0" stroke-width="3"/>
  <rect x="20" y="20" width="860" height="36" fill="#2A251E"/>
  <rect x="20" y="56" width="860" height="3" fill="#DFC9A0"/>
  <circle cx="44" cy="38" r="6" fill="#9C8456"/>
  <circle cx="64" cy="38" r="6" fill="#B29B71"/>
  <circle cx="84" cy="38" r="6" fill="#DFC9A0"/>
  <text class="mono t dim" x="450" y="43" font-size="14" text-anchor="middle" style="font-size:14px">pipeline.sh</text>

  <!-- linhas -->
  <g class="mono">
    <text class="l1 t" x="48" y="96"><tspan class="dim">$</tspan> ./pipeline.sh</text>
    <text class="l2 t" x="48" y="126"><tspan class="dim">›</tspan> raw &gt; trusted &gt; refined  ok</text>
    <text class="l3 name" x="48" y="172">Alonso Moura Germano</text>
    <text class="l4 t" x="48" y="204"><tspan class="dim">›</tspan> Dados · Back-end · Automação com IA</text>
    <text class="l5 t" x="48" y="236"><tspan class="dim">$</tspan> echo "café pronto"</text>
    <rect class="cursor" x="260" y="222" width="10" height="18"/>
  </g>

  <!-- xícara em pixel art -->
  <g transform="translate(724 112)">
    <rect class="steam" x="22" y="-4" width="6" height="14"/>
    <rect class="steam s2" x="40" y="-10" width="6" height="14"/>
    <rect class="steam s3" x="58" y="-4" width="6" height="14"/>
    <rect x="8" y="24" width="72" height="64" fill="#DFC9A0"/>
    <rect x="8" y="24" width="72" height="8" fill="#F4EBDA"/>
    <rect x="80" y="36" width="20" height="8" fill="#DFC9A0"/>
    <rect x="92" y="36" width="8" height="32" fill="#DFC9A0"/>
    <rect x="80" y="60" width="20" height="8" fill="#DFC9A0"/>
    <rect x="16" y="40" width="56" height="8" fill="#5D5039"/>
    <rect x="0" y="88" width="88" height="8" fill="#9C8456"/>
  </g>
</svg>
